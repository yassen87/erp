<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Service - React UI</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #10b981;
            --primary-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #root {
            width: 100%;
            max-width: 550px;
            animation: fadeIn 0.8s ease-out;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease;
        }

        h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
            animation: pulse 2s infinite;
        }

        .qr-wrapper img {
            width: 240px;
            height: 240px;
            display: block;
            border-radius: 10px;
        }

        .form-group {
            text-align: right;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--text-main);
            font-size: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            background: rgba(15, 23, 42, 0.8);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #fff;
            font-weight: 800;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
            font-family: inherit;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(16, 185, 129, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background: var(--text-muted);
            box-shadow: none;
        }

        .status-msg {
            margin-top: 20px;
            font-weight: 700;
            font-size: 15px;
            padding: 12px;
            border-radius: 8px;
            animation: slideUp 0.3s ease-out;
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function WhatsAppService() {
            const [status, setStatus] = useState('initializing');
            const [qrCode, setQrCode] = useState('');
            const [phone, setPhone] = useState('');
            const [message, setMessage] = useState('');
            const [isSending, setIsSending] = useState(false);
            const [toast, setToast] = useState(null);

            useEffect(() => {
                let interval;
                const checkStatus = async () => {
                    try {
                        const res = await fetch('/api/status');
                        const data = await res.json();
                        setStatus(data.status);
                        if (data.qr) setQrCode(data.qr);
                        
                        if (data.status === 'ready') {
                            clearInterval(interval);
                        }
                    } catch (err) {
                        console.error('Error fetching status:', err);
                    }
                };

                checkStatus();
                interval = setInterval(checkStatus, 2000);
                return () => clearInterval(interval);
            }, []);

            const handleSend = async () => {
                if (!phone || !message) {
                    setToast({ text: 'يرجى إدخال الرقم والرسالة أولاً ⚠️', type: 'error' });
                    return;
                }
                
                setIsSending(true);
                setToast({ text: 'جاري الإرسال... ⏳', type: 'info' });

                try {
                    const res = await fetch('/api/send-message', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, message })
                    });
                    const data = await res.json();
                    
                    if (data.success) {
                        setToast({ text: 'تم إرسال الرسالة بنجاح ✅', type: 'success' });
                        setMessage(''); // مسح حقل الرسالة بعد النجاح
                    } else {
                        setToast({ text: 'حدث خطأ: ' + data.error, type: 'error' });
                    }
                } catch (err) {
                    setToast({ text: 'فشل الاتصال بالسيرفر ❌', type: 'error' });
                } finally {
                    setIsSending(false);
                }
            };

            const renderContent = () => {
                if (status === 'initializing' || status === 'disconnected') {
                    return (
                        <div className="glass-panel">
                            <div className="loader"></div>
                            <h1>تهيئة نظام الواتساب</h1>
                            <p>جاري الاتصال بخوادم واتساب... يرجى الانتظار ثوانٍ معدودة.</p>
                        </div>
                    );
                }

                if (status === 'needs_scan') {
                    return (
                        <div className="glass-panel">
                            <h1>ربط واتساب بالبرنامج</h1>
                            <p>قم بفتح تطبيق الواتساب على هاتفك، اذهب إلى الأجهزة المرتبطة، وصور الكود التالي:</p>
                            <div className="qr-wrapper">
                                <img src={qrCode} alt="QR Code" />
                            </div>
                        </div>
                    );
                }

                if (status === 'ready') {
                    return (
                        <div className="glass-panel" style={{ textAlign: 'center' }}>
                            <h1>مركز اتصال الواتساب 💬</h1>
                            <p>تم الربط بنجاح! السيرفر جاهز الآن لإرسال الفواتير والرسائل مباشرة.</p>
                            
                            <div style={{ marginTop: '30px' }}>
                                <div className="form-group">
                                    <label>رقم هاتف العميل (اختياري بكود الدولة)</label>
                                    <input 
                                        type="text" 
                                        value={phone} 
                                        onChange={e => setPhone(e.target.value)} 
                                        placeholder="مثال: 01012345678" 
                                    />
                                </div>
                                
                                <div className="form-group">
                                    <label>محتوى الرسالة</label>
                                    <textarea 
                                        rows="4" 
                                        value={message} 
                                        onChange={e => setMessage(e.target.value)} 
                                        placeholder="اكتب العرض، الترحيب، أو الرسالة هنا..." 
                                    />
                                </div>
                                
                                <button onClick={handleSend} disabled={isSending}>
                                    {isSending ? 'جاري الإرسال ⏳...' : 'إرسال الرسالة الآن 🚀'}
                                </button>
                                
                                {toast && (
                                    <div className="status-msg" style={{ 
                                        backgroundColor: toast.type === 'error' ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)',
                                        color: toast.type === 'error' ? 'var(--danger)' : 'var(--primary)' 
                                    }}>
                                        {toast.text}
                                    </div>
                                )}
                            </div>
                        </div>
                    );
                }

                return null;
            };

            return renderContent();
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WhatsAppService />);
    </script>
</body>
</html>
